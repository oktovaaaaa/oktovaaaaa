<svg width="270" height="84" viewBox="0 0 270 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardNeonGlow-tg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="elementGlow-tg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="borderGradient-tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#00a8ff" />
      <stop offset="70%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <radialGradient id="topFlare-tg" cx="10%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes chevronShift-tg {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2.5px); }
    }
    .hud-chevrons-tg {
      animation: chevronShift-tg 1.6s ease-in-out infinite;
    }
    .hud-title-tg {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 14.5px;
      font-weight: 900;
      letter-spacing: 2.8px;
      fill: #00f0ff;
    }
    .hud-subtitle-tg {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect x="4" y="4" width="262" height="76" rx="14" fill="#060b14" />
  
  <!-- Subtle Specular Flare in Top Left -->
  <rect x="4" y="4" width="262" height="76" rx="14" fill="url(#topFlare-tg)" />

  <!-- Outer Neon Glowing Border -->
  <rect x="4" y="4" width="262" height="76" rx="14" stroke="url(#borderGradient-tg)" stroke-width="1.8" filter="url(#elementGlow-tg)" />

  <!-- HUD Corner Brackets (Exact Rounded Corners) -->
  <path d="M 15 25 V 18 A 3 3 0 0 1 18 15 H 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 245 15 H 252 A 3 3 0 0 1 255 18 V 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 15 59 V 66 A 3 3 0 0 0 18 69 H 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 245 69 H 252 A 3 3 0 0 0 255 66 V 59" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Left Icon Squircle Box -->
  <rect x="33" y="24" width="36" height="36" rx="9" fill="#091424" stroke="#00e5ff" stroke-width="1.5" filter="url(#elementGlow-tg)" />
  
  <!-- Icon Group -->
  <g transform="translate(33, 24)">
    
  <g transform="translate(6, 6) scale(1)">
    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" fill="#00f0ff"/>
  </g>

  </g>

  <!-- Middle Text: Title -->
  <text x="82" y="39" class="hud-title-tg" filter="url(#elementGlow-tg)">TELEGRAM</text>
  
  <!-- Subtitle: Username, Domain or Number -->
  <text x="82" y="56" class="hud-subtitle-tg">0881080811110</text>

  <!-- Right Chevrons >> -->
  <g class="hud-chevrons-tg" filter="url(#elementGlow-tg)">
    <path d="M 228 36 L 234 42 L 228 48" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 235 36 L 241 42 L 235 48" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>