<svg width="270" height="84" viewBox="0 0 270 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardNeonGlow-dc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="elementGlow-dc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="borderGradient-dc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#00a8ff" />
      <stop offset="70%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <radialGradient id="topFlare-dc" cx="10%" cy="15%" r="80%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes chevronShift-dc {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2.5px); }
    }
    .hud-chevrons-dc {
      animation: chevronShift-dc 1.6s ease-in-out infinite;
    }
    .hud-title-dc {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 14.5px;
      font-weight: 900;
      letter-spacing: 2.8px;
      fill: #00f0ff;
    }
    .hud-subtitle-dc {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect x="4" y="4" width="262" height="76" rx="14" fill="#060b14" />
  
  <!-- Subtle Specular Flare in Top Left -->
  <rect x="4" y="4" width="262" height="76" rx="14" fill="url(#topFlare-dc)" />

  <!-- Outer Neon Glowing Border -->
  <rect x="4" y="4" width="262" height="76" rx="14" stroke="url(#borderGradient-dc)" stroke-width="1.8" filter="url(#elementGlow-dc)" />

  <!-- HUD Corner Brackets (Exact Rounded Corners) -->
  <path d="M 15 25 V 18 A 3 3 0 0 1 18 15 H 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 245 15 H 252 A 3 3 0 0 1 255 18 V 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 15 59 V 66 A 3 3 0 0 0 18 69 H 25" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 245 69 H 252 A 3 3 0 0 0 255 66 V 59" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Left Icon Squircle Box -->
  <rect x="33" y="24" width="36" height="36" rx="9" fill="#091424" stroke="#00e5ff" stroke-width="1.5" filter="url(#elementGlow-dc)" />
  
  <!-- Icon Group -->
  <g transform="translate(33, 24)">
    
  <g transform="translate(6, 6) scale(1)">
    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" fill="#00f0ff"/>
  </g>

  </g>

  <!-- Middle Text: Title -->
  <text x="82" y="39" class="hud-title-dc" filter="url(#elementGlow-dc)">DISCORD</text>
  
  <!-- Subtitle: Username, Domain or Number -->
  <text x="82" y="56" class="hud-subtitle-dc">oktovaaaaa</text>

  <!-- Right Chevrons >> -->
  <g class="hud-chevrons-dc" filter="url(#elementGlow-dc)">
    <path d="M 228 36 L 234 42 L 228 48" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 235 36 L 241 42 L 235 48" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>