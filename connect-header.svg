<svg width="850" height="110" viewBox="0 0 850 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlowHeader" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="78%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseTargetDot {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .pulsing-target {
      animation: pulseTargetDot 2s ease-in-out infinite;
      transform-origin: 660px 88px;
    }
    .tech-header-title {
      font-family: 'Courier New', 'Consolas', 'Segoe UI', monospace;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 16px;
      fill: #00f0ff;
    }
    .tech-header-sub {
      font-family: 'Courier New', 'Consolas', monospace;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 4.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Title: C O N N E C T -->
  <text x="433" y="44" text-anchor="middle" class="tech-header-title" filter="url(#neonGlowHeader)">C O N N E C T</text>

  <!-- Subtitle: // ESTABLISHING UPLINK - OKTOVA SAMOSIR -->
  <text x="433" y="70" text-anchor="middle" class="tech-header-sub" filter="url(#softGlowHeader)">// ESTABLISHING UPLINK — OKTOVA SAMOSIR</text>

  <!-- Glowing Horizontal Line -->
  <line x1="50" y1="88" x2="800" y2="88" stroke="url(#cyberLineGrad)" stroke-width="2.2" />

  <!-- Target Indicator Dot -->
  <circle cx="660" cy="88" r="4.5" fill="#00f0ff" filter="url(#neonGlowHeader)" class="pulsing-target" />
</svg>